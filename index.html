<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEFDYGAMES | Premium Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1 id="main-heading">FEFDYGAMES</h1>
            <div class="level-indicator">Level <span id="current-level">1</span>/3</div>
        </header>

        <main>
            <div class="ui-side">
                <div class="reference-box" id="reference-container">
                    <p>Reference</p>
                    <img id="reference-img" src="image1.png" alt="Reference">
                </div>
                <div class="stats-box">    
                    <div class="stat">
                        <span class="label">Moves</span>
                        <span id="move-count">0</span>
                    </div>
                </div>
                <button id="shuffle-btn">Shuffle Game</button>
            </div>

            <div class="puzzle-area">
                <div id="puzzle-grid" class="grid-3x3">
                    <!-- Puzzle pieces generated by JS -->
                </div>
            </div>
        </main>

        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Level Complete!</h2>
                <p>Amazing job. Ready for the next challenge?</p>
                <button id="next-level-btn">Next Level</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
